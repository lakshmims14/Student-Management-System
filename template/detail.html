
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.7;
        }

        /* Page heading */
        .heading {
            background-color: #f1f5f9;
            padding: 55px 8%;
        }

        .heading p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .heading h1 {
            font-size: 38px;
            color: #172554;
        }

        /* Main course content */
        main {
            width: 84%;
            margin: 50px auto;
        }

        .course-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
            margin-bottom: 35px;
        }

        .level {
            display: inline-block;
            color: #2563eb;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        main h2 {
            font-size: 34px;
            color: #172554;
            margin-bottom: 20px;
        }

        .description {
            font-size: 17px;
            color: #555;
            max-width: 1000px;
            margin-bottom: 40px;
        }

        /* Course information */
        .information {
            padding: 30px 0;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        .information h3 {
            font-size: 25px;
            color: #172554;
            margin-bottom: 22px;
        }

        .information p {
            font-size: 17px;
            margin-bottom: 15px;
            color: #555;
        }

        .information strong {
            color: #222;
            display: inline-block;
            min-width: 140px;
        }

        /* Responsive layout */
        @media (max-width: 768px) {
            .heading {
                padding: 35px 5%;
            }

            .heading h1 {
                font-size: 30px;
            }

            main {
                width: 90%;
                margin: 30px auto;
            }

            .course-image {
                height: 280px;
            }

            main h2 {
                font-size: 27px;
            }

            .description,
            .information p {
                font-size: 16px;
            }

            .information strong {
                min-width: auto;
                margin-right: 5px;
            }
        }

        @media (max-width: 480px) {
            .course-image {
                height: 210px;
            }

            main h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header class="heading">
        <h1>Explore Your Course</h1>
    </header>

    <main>
        <img class="course-image"
             src="{{ course.img.url }}"
             alt="{{ course.name }}">

        <span class="level">{{ course.level }}</span>

        <h2>{{ course.name }}</h2>

        <p class="description">
            {{ course.desc }}
        </p>

        <section class="information">
            <h3>Course Information</h3>

            <p>
                <strong>Year:</strong>
                {{ course.year }}
            </p>

            <p>
                <strong>Eligibility:</strong>
                {{ course.eligibility }}
            </p>
        </section>
    </main>

</body>
</html>
